<section class="phone-wrapper">
  <div class="phone-card">
    <h1><i class="fas fa-phone"></i> Verify your phone</h1>
    <p>We need your phone number to share enquiries and secure your account.</p>

    <div class="form-group">
      <label>Phone Number</label>
      <input
        type="tel"
        [(ngModel)]="phoneNumber"
        placeholder="e.g. +91 98765 43210"
        maxlength="15"
      />
    </div>

    <button class="btn-primary" (click)="submit()">
      <i class="fas fa-check"></i>
      Verify & Continue
    </button>
  </div>
</section>
